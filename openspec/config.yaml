schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Rosário Meditativo — app mobile Expo (Android-first) para rezar o Terço
  com meditação dinâmica (passagens, comentários, imagens via Supabase). MVP sem auth.
  Código em src/: features, shared, data, domain. Especificação de produto em docs/project-spec.md.

rules:
  proposal:
    - Declarar explicitamente o que está fora do escopo
    - Referenciar capabilities afetadas em openspec/specs/
  specs:
    - Texto de cenários em pt-BR; manter SHALL/MUST em inglês
    - Preferir GIVEN/WHEN/THEN; incluir pelo menos um cenário de falha ou limite por requirement crítico
  tasks:
    - Marcar tarefas verificáveis (comando ou critério observável)

operations:
  apply:
    guidance:
      - Rodar npx tsc --noEmit antes de marcar tasks concluídas
      - Não alterar openspec/specs/ principais fora de sync/archive
  archive:
    guidance:
      - Confirmar openspec validate --all --strict antes de arquivar
